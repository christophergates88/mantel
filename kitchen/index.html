<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://*.workers.dev; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#E7E1D6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Simmer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Simmer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <h1 class="mark">Simmer</h1>
  <p class="sub" id="sub"></p>
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabs" aria-label="Sections">
  <button data-tab="home" aria-current="page">Tonight</button>
  <button data-tab="recipes">Recipes</button>
  <button data-tab="kitchen">Kitchen</button>
  <button data-tab="list">List <span class="count" id="listCount" hidden></span></button>
</nav>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="photo" accept="image/*" multiple hidden>

<script type="module" src="app.js"></script>
</body>
</html>
